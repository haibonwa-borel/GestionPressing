<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Commandes')"></head>
<body>
<th:block th:replace="layout :: themeScript"></th:block>
<div class="app-container">
    <header th:replace="layout :: header"></header>
    <div class="main-layout">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="content-area">

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
                <div>
                    <h1 style="font-size: 24px; margin-bottom: 4px;">Commandes</h1>
                    <p style="color: var(--yt-text-secondary); font-size: 14px;">
                        <span th:text="${#lists.size(commandes)}">0</span> commande(s)
                    </p>
                </div>
                <button class="yt-btn action" onclick="openModal('modal-add-commande')">
                    <i class="fas fa-plus"></i> Nouvelle commande
                </button>
            </div>

            <!-- Table Commandes -->
            <div class="yt-table-container">
                <table class="yt-table">
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Client</th>
                            <th>Type</th>
                            <th>Statut</th>
                            <th>Prix</th>
                            <th>Dépôt</th>
                            <th>Retrait prévu</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(commandes)}">
                            <td colspan="8" style="text-align:center; color: var(--yt-text-secondary); padding: 40px;">
                                <i class="fas fa-shopping-bag" style="font-size: 32px; margin-bottom: 12px; display: block;"></i>
                                Aucune commande
                            </td>
                        </tr>
                        <tr th:each="c : ${commandes}">
                            <td>
                                <span style="font-family: monospace; background: var(--yt-surface-hover);
                                     padding: 4px 8px; border-radius: 4px; font-size: 12px;"
                                      th:text="'#' + ${c.id}">-</span>
                            </td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <div style="width: 32px; height: 32px; border-radius: 50%;
                                         background: var(--yt-surface-hover); display: flex;
                                         align-items: center; justify-content: center; font-size: 14px;">
                                        <i class="fas fa-user"></i>
                                    </div>
                                    <span th:text="'Client #' + ${c.utilisateurId}">-</span>
                                </div>
                            </td>
                            <td>
                                <span th:switch="${c.type.name()}">
                                    <span th:case="'EXPRESS'" style="color: var(--yt-red); font-weight: 500;">⚡ Express</span>
                                    <span th:case="'RAPIDE'" style="color: orange; font-weight: 500;">🚀 Rapide</span>
                                    <span th:case="*" style="color: var(--yt-text-secondary);">📦 Normal</span>
                                </span>
                            </td>
                            <td>
                                <span th:switch="${c.statut.name()}"
                                      style="padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 500;">
                                    <span th:case="'EN_ATTENTE'" class="badge pending">⏳ En attente</span>
                                    <span th:case="'EN_COURS'" class="badge processing">🔄 En cours</span>
                                    <span th:case="'TERMINEE'" class="badge done">✅ Terminée</span>
                                    <span th:case="*" style="background: var(--yt-surface-hover); padding: 4px 10px; border-radius: 4px;" th:text="${c.statut}">-</span>
                                </span>
                            </td>
                            <td style="font-weight: 500;">
                                <span th:text="${#numbers.formatDecimal(c.prixTotal, 0, 0)} + ' FCFA'">0</span>
                            </td>
                            <td style="color: var(--yt-text-secondary); font-size: 13px;"
                                th:text="${#temporals.format(c.dateCreation, 'dd/MM/yy')}">-</td>
                            <td style="color: var(--yt-accent); font-size: 13px; font-weight: 500;"
                                th:text="${#temporals.format(c.dateLivraison, 'dd/MM/yy')}">-</td>
                            <td>
                                <div style="display: flex; gap: 8px;">
                                    <button class="yt-btn" style="padding: 6px 10px; font-size: 12px;"
                                            th:onclick="openEditCommandeModal([[${c.id}]], [[${c.type}]], [[${c.statut}]], [[${c.utilisateurId}]])">
                                        <i class="fas fa-pen"></i> Éditer
                                    </button>
                                    <button class="yt-btn action" style="padding: 6px 10px; font-size: 12px;"
                                            th:onclick="'envoyerFacture(' + ${c.id} + ')'">
                                        <i class="fas fa-envelope"></i> Facture
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<!-- Modal Ajout Commande -->
<div id="modal-add-commande" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-shopping-bag" style="color: var(--yt-accent); margin-right: 8px;"></i>Nouvelle commande</h2>
            <button class="close-btn" onclick="closeModal('modal-add-commande')">×</button>
        </div>
        <form id="form-add-commande" onsubmit="submitCommande(event)">
            <div class="form-group">
                <label>Client *</label>
                <select class="form-control" name="utilisateurId" required>
                    <option value="" disabled selected>-- Sélectionner un client --</option>
                    <option th:each="u : ${utilisateurs}" th:value="${u.id}" th:text="${u.prenom + ' ' + u.nom}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Type de commande *</label>
                <select class="form-control" name="type" required>
                    <option value="NORMAL">Normal</option>
                    <option value="RAPIDE">Rapide</option>
                    <option value="EXPRESS">Express</option>
                </select>
            </div>
            <div class="form-group">
                <label>Vêtements (Maintenez Ctrl pour en sélectionner plusieurs)</label>
                <select class="form-control" name="vetementIds" multiple style="height: 120px;">
                    <option th:each="v : ${vetements}" th:value="${v.id}" th:text="${v.description + ' (' + v.sku + ')'}"></option>
                </select>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="button" class="yt-btn" onclick="closeModal('modal-add-commande')">Annuler</button>
                <button type="submit" class="yt-btn action" style="flex: 1;" id="btn-submit-commande">
                    <i class="fas fa-save"></i> Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Edit Commande -->
<div id="modal-edit-commande" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-pen" style="color: var(--yt-accent); margin-right: 8px;"></i>Modifier la commande</h2>
            <button class="close-btn" onclick="closeModal('modal-edit-commande')">×</button>
        </div>
        <form id="form-edit-commande" onsubmit="submitEditCommande(event)">
            <input type="hidden" id="edit-cmd-id" name="id">
            <input type="hidden" id="edit-cmd-utilisateurId" name="utilisateurId">
            <div class="form-group">
                <label>Statut de la commande *</label>
                <select class="form-control" id="edit-cmd-statut" name="statut" required>
                    <option value="EN_ATTENTE">En attente</option>
                    <option value="EN_COURS">En cours</option>
                    <option value="TERMINEE">Terminée</option>
                    <option value="LIVREE">Livrée</option>
                </select>
            </div>
            <div class="form-group">
                <label>Type de commande *</label>
                <select class="form-control" id="edit-cmd-type" name="type" required>
                    <option value="NORMAL">Normal</option>
                    <option value="RAPIDE">Rapide</option>
                    <option value="EXPRESS">Express</option>
                </select>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="button" class="yt-btn" onclick="closeModal('modal-edit-commande')">Annuler</button>
                <button type="submit" class="yt-btn action" style="flex: 1;" id="btn-submit-edit-cmd">
                    <i class="fas fa-save"></i> Mettre à jour
                </button>
            </div>
        </form>
    </div>
</div>

<div id="toast" style="display:none; position:fixed; bottom:24px; right:24px;
     background:var(--yt-surface); border:1px solid var(--yt-border); border-radius:8px;
     padding:16px 24px; font-size:14px; z-index:9999; box-shadow: 0 4px 24px rgba(0,0,0,0.4);">
</div>

<script>
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 4000);
}

function envoyerFacture(id) {
    fetch('/api/notifications/commandes/' + id + '/facture', { method: 'POST' })
        .then(res => res.text())
        .then(data => showToast('✅ ' + data))
        .catch(err => showToast('❌ Erreur : ' + err));
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
});

function openEditCommandeModal(id, type, statut, utilisateurId) {
    document.getElementById('edit-cmd-id').value = id;
    document.getElementById('edit-cmd-type').value = type;
    document.getElementById('edit-cmd-statut').value = statut;
    document.getElementById('edit-cmd-utilisateurId').value = utilisateurId;
    openModal('modal-edit-commande');
}

function submitEditCommande(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-edit-cmd');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> En cours...';
    
    const form = e.target;
    const formData = new FormData(form);
    
    // Commandes API doesn't allow user/vetements change on PUT easily without specific handling, 
    // but the API expects utilisateurId. We might need to send the old one if the backend requires it.
    // The current CommandeController consumes APPLICATION_FORM_URLENCODED_VALUE.
    const data = new URLSearchParams(formData); 
    const id = document.getElementById('edit-cmd-id').value;
    
    fetch('/api/commandes/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: data
    })
    .then(res => {
        if (!res.ok) throw new Error("Erreur de modification");
        window.location.reload();
    })
    .catch(err => {
        alert("Erreur : (Vérifiez que tous les champs obligatoires comme Utilisateur sont gérés par le backend)");
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Mettre à jour';
    });
}

function submitCommande(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-commande');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> En cours...';
    
    const form = e.target;
    const formData = new FormData(form);
    const data = new URLSearchParams(formData); 
    
    fetch('/api/commandes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: data
    })
    .then(res => {
        if (!res.ok) throw new Error("Erreur de création");
        return res.json();
    })
    .then(data => {
        window.location.reload();
    })
    .catch(err => {
        alert("Erreur : " + err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Enregistrer';
    });
}
</script>
</body>
</html>
