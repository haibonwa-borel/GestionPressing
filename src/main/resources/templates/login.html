<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title} + ' - ' + #{app.name}">Connexion - Pressing App</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        (function() {
            const saved = localStorage.getItem('pressing-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--yt-bg);
            font-family: 'Roboto', sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            background: var(--yt-surface);
            border: 1px solid var(--yt-border);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo i {
            font-size: 48px;
            color: #4285F4;
            margin-bottom: 12px;
        }
        .login-logo h1 {
            font-size: 24px;
            color: var(--yt-text-primary);
            margin: 8px 0 4px;
        }
        .login-logo p {
            color: var(--yt-text-secondary);
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--yt-text-secondary);
            margin-bottom: 6px;
        }
        .form-group .input-wrapper {
            position: relative;
        }
        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--yt-text-secondary);
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: var(--yt-bg);
            border: 1px solid var(--yt-border);
            border-radius: 10px;
            color: var(--yt-text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #4285F4;
        }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .remember-row input[type="checkbox"] {
            accent-color: #4285F4;
        }
        .remember-row label {
            color: var(--yt-text-secondary);
            font-size: 13px;
            cursor: pointer;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4285F4, #3367D6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(66, 133, 244, 0.4);
        }
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-error {
            background: rgba(234, 67, 53, 0.15);
            color: #EA4335;
            border: 1px solid rgba(234, 67, 53, 0.3);
        }
        .alert-success {
            background: rgba(52, 168, 83, 0.15);
            color: #34A853;
            border: 1px solid rgba(52, 168, 83, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-tshirt"></i>
                <h1>Pressing<span style="font-weight: 400;">App</span></h1>
                <p th:text="#{login.subtitle}">Connectez-vous pour accéder au tableau de bord</p>
            </div>

            <!-- Message d'erreur en cas d'identifiants invalides -->
            <div th:if="${param.error}" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="#{login.error}">Identifiants invalides. Veuillez réessayer.</span>
            </div>

            <!-- Message de confirmation de deconnexion -->
            <div th:if="${param.logout}" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="#{login.logout}">Déconnexion réussie.</span>
            </div>

            <!-- Formulaire de connexion -->
            <!-- Le token CSRF est ajoute automatiquement par Thymeleaf (th:action) -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="email" th:text="#{login.email}">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" required
                               th:placeholder="#{login.email.placeholder}" placeholder="votre@email.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="motDePasse" th:text="#{login.password}">Mot de passe</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="motDePasse" name="motDePasse" required
                               th:placeholder="#{login.password.placeholder}" placeholder="Votre mot de passe">
                    </div>
                </div>

                <div class="remember-row">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <label for="remember-me" th:text="#{login.remember}">Se souvenir de moi</label>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span th:text="#{login.submit}">Se connecter</span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
