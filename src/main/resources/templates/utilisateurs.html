<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{clients.title})}"></head>
<body>
<th:block th:replace="~{layout :: themeScript}"></th:block>
<div class="app-container">
    <header th:replace="~{layout :: header}"></header>
    <div class="main-layout">
        <aside th:replace="~{layout :: sidebar}"></aside>
        <main class="content-area">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h1 style="font-size: 24px; margin-bottom: 8px;" th:text="#{clients.title}">Gestion des Clients</h1>
                    <p style="color: var(--yt-text-secondary);" th:text="#{clients.subtitle}">Ajoutez, modifiez ou consultez la liste de vos clients.</p>
                </div>
                <div style="display: flex; gap: 16px; align-items: center;">
                    <div style="position: relative;">
                        <i class="fas fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--yt-text-secondary);"></i>
                        <input type="text" id="search-input" th:placeholder="#{clients.search}" placeholder="Rechercher un client..." onkeyup="filterTable('search-input', 'table-utilisateurs')" style="background: var(--yt-surface); border: 1px solid var(--yt-border); color: var(--yt-text-primary); padding: 8px 12px 8px 36px; border-radius: 18px; outline: none; width: 250px;">
                    </div>
                    <button class="yt-btn action" onclick="openModal('modal')">
                        <i class="fas fa-plus"></i> <span th:text="#{clients.new}">Nouveau Client</span>
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="yt-table-container">
                <table class="yt-table" id="table-utilisateurs">
                    <thead>
                        <tr>
                            <th th:text="#{clients.col.client}">Client</th>
                            <th th:text="#{clients.col.email}">Email</th>
                            <th th:text="#{clients.col.phone}">Téléphone</th>
                            <th th:text="#{clients.col.id}">ID</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(utilisateurs)}">
                            <td colspan="4" style="text-align:center; color: var(--yt-text-secondary); padding: 40px;">
                                <i class="fas fa-users" style="font-size: 32px; margin-bottom: 12px; display: block;"></i>
                                <span th:text="#{clients.empty}">Aucun client enregistré</span>
                            </td>
                        </tr>
                        <tr th:each="u : ${utilisateurs}">
                            <td>
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <div style="width: 36px; height: 36px; border-radius: 50%;
                                         background: var(--yt-accent); color: #000;
                                         display: flex; align-items: center; justify-content: center;
                                         font-weight: 700; font-size: 14px; flex-shrink: 0;"
                                         th:text="${#strings.toUpperCase(#strings.substring(u.prenom, 0, 1))}">A</div>
                                    <div>
                                        <div style="font-weight: 500;" th:text="${u.prenom + ' ' + u.nom}">Nom</div>
                                    </div>
                                </div>
                            </td>
                            <td style="color: var(--yt-text-secondary);" th:text="${u.email}">email</td>
                            <td style="color: var(--yt-text-secondary);" th:text="${u.telephone ?: '-'}">tél</td>
                            <td>
                                <span style="background: var(--yt-surface-hover); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: monospace;"
                                      th:text="'#' + ${u.id}">-</span>
                            </td>
                            <td>
                                <button class="yt-btn" style="padding: 6px 10px; font-size: 12px;"
                                        th:onclick="openEditModal([[${u.id}]], [[${u.nom}]], [[${u.prenom}]], [[${u.email}]], [[${u.telephone}]])">
                                    <i class="fas fa-pen"></i> <span th:text="#{clients.edit}">Éditer</span>
                                </button>
                                <form th:action="@{/utilisateurs/{id}(id=${u.id})}" th:method="delete" style="display:inline;" th:attr="onsubmit='return confirm(\'' + #{clients.confirmDelete} + '\')'">
                                    <button type="submit" class="yt-btn" style="padding: 6px 10px; font-size: 12px; color: var(--yt-red);">
                                        <i class="fas fa-trash"></i> <span th:text="#{clients.delete}">Supprimer</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<!-- Modal Ajout Client -->
<div id="modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-user-plus" style="color: var(--yt-accent); margin-right: 8px;"></i><span th:text="#{client.form.new}">Nouveau client</span></h2>
            <button class="close-btn" onclick="closeModal('modal')">×</button>
        </div>
        <form id="form-add-client" th:action="@{/utilisateurs}" method="post">
            <div class="form-group">
                <label th:text="#{client.form.firstName} + ' *'">Prénom *</label>
                <input class="form-control" type="text" name="prenom" required placeholder="Jean">
            </div>
            <div class="form-group">
                <label th:text="#{client.form.lastName} + ' *'">Nom *</label>
                <input class="form-control" type="text" name="nom" required placeholder="Dupont">
            </div>
            <div class="form-group">
                <label th:text="#{client.form.email} + ' *'">Email *</label>
                <input class="form-control" type="email" name="email" required placeholder="jean.dupont@email.com">
            </div>
            <div class="form-group">
                <label th:text="#{client.form.password} + ' *'">Mot de passe *</label>
                <input class="form-control" type="password" name="motDePasse" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label th:text="#{client.form.phone}">Téléphone</label>
                <input class="form-control" type="tel" name="telephone" placeholder="+237 6xx xxx xxx">
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="button" class="yt-btn" onclick="closeModal('modal')" th:text="#{client.form.cancel}">Annuler</button>
                <button type="submit" class="yt-btn action" style="flex: 1;">
                    <i class="fas fa-save"></i> <span th:text="#{client.form.save}">Enregistrer</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Edit Client -->
<div id="modal-edit" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-pen" style="color: var(--yt-accent); margin-right: 8px;"></i><span th:text="#{client.form.edit}">Modifier le client</span></h2>
            <button class="close-btn" onclick="closeModal('modal-edit')">×</button>
        </div>
        <form id="form-edit-client" th:action="@{/utilisateurs}" th:method="put">
            <input type="hidden" id="edit-id" name="id">
            <div class="form-group">
                <label th:text="#{client.form.firstName} + ' *'">Prénom *</label>
                <input class="form-control" type="text" id="edit-prenom" name="prenom" required>
            </div>
            <div class="form-group">
                <label th:text="#{client.form.lastName} + ' *'">Nom *</label>
                <input class="form-control" type="text" id="edit-nom" name="nom" required>
            </div>
            <div class="form-group">
                <label th:text="#{client.form.email} + ' *'">Email *</label>
                <input class="form-control" type="email" id="edit-email" name="email" required>
            </div>
            <div class="form-group">
                <label th:text="#{client.form.phone}">Téléphone</label>
                <input class="form-control" type="tel" id="edit-telephone" name="telephone">
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="button" class="yt-btn" onclick="closeModal('modal-edit')" th:text="#{client.form.cancel}">Annuler</button>
                <button type="submit" class="yt-btn action" style="flex: 1;" id="btn-submit-edit">
                    <i class="fas fa-save"></i> <span th:text="#{client.form.update}">Mettre à jour</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function openModal(id) { document.getElementById(id || 'modal').classList.add('active'); }
function closeModal(id) { document.getElementById(id || 'modal').classList.remove('active'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
});

function openEditModal(id, nom, prenom, email, telephone) {
    document.getElementById('form-edit-client').action = '/utilisateurs/' + id;
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-nom').value = nom;
    document.getElementById('edit-prenom').value = prenom;
    document.getElementById('edit-email').value = email;
    document.getElementById('edit-telephone').value = telephone || '';
    openModal('modal-edit');
}

</script>
<div th:replace="layout :: chatbot"></div>
</body>
</html>
