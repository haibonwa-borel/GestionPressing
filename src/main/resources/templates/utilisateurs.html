<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Clients')"></head>
<body>
<th:block th:replace="layout :: themeScript"></th:block>
<div class="app-container">
    <header th:replace="layout :: header"></header>
    <div class="main-layout">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="content-area">

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
                <div>
                    <h1 style="font-size: 24px; margin-bottom: 4px;">Clients</h1>
                    <p style="color: var(--yt-text-secondary); font-size: 14px;">
                        <span th:text="${#lists.size(utilisateurs)}">0</span> client(s) enregistré(s)
                    </p>
                </div>
                <button class="yt-btn action" onclick="openModal()">
                    <i class="fas fa-plus"></i> Ajouter un client
                </button>
            </div>

            <!-- Table Clients -->
            <div class="yt-table-container">
                <table class="yt-table">
                    <thead>
                        <tr>
                            <th>Client</th>
                            <th>Email</th>
                            <th>Téléphone</th>
                            <th>ID</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(utilisateurs)}">
                            <td colspan="4" style="text-align:center; color: var(--yt-text-secondary); padding: 40px;">
                                <i class="fas fa-users" style="font-size: 32px; margin-bottom: 12px; display: block;"></i>
                                Aucun client enregistré
                            </td>
                        </tr>
                        <tr th:each="u : ${utilisateurs}">
                            <td>
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <div style="width: 36px; height: 36px; border-radius: 50%;
                                         background: var(--yt-accent); color: #000;
                                         display: flex; align-items: center; justify-content: center;
                                         font-weight: 700; font-size: 14px; flex-shrink: 0;"
                                         th:text="${#strings.toUpperCase(#strings.substring(u.prenom, 0, 1))}">A</div>
                                    <div>
                                        <div style="font-weight: 500;" th:text="${u.prenom + ' ' + u.nom}">Nom</div>
                                    </div>
                                </div>
                            </td>
                            <td style="color: var(--yt-text-secondary);" th:text="${u.email}">email</td>
                            <td style="color: var(--yt-text-secondary);" th:text="${u.telephone ?: '-'}">tél</td>
                            <td>
                                <span style="background: var(--yt-surface-hover); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: monospace;"
                                      th:text="'#' + ${u.id}">-</span>
                            </td>
                            <td>
                                <button class="yt-btn" style="padding: 6px 10px; font-size: 12px;"
                                        th:onclick="openEditModal([[${u.id}]], [[${u.nom}]], [[${u.prenom}]], [[${u.email}]], [[${u.telephone}]])">
                                    <i class="fas fa-pen"></i> Éditer
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<!-- Modal Ajout Client -->
<div id="modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-user-plus" style="color: var(--yt-accent); margin-right: 8px;"></i>Nouveau client</h2>
            <button class="close-btn" onclick="closeModal('modal')">×</button>
        </div>
        <form th:action="@{/utilisateurs}" method="post">
            <div class="form-group">
                <label>Prénom *</label>
                <input class="form-control" type="text" name="prenom" required placeholder="Jean">
            </div>
            <div class="form-group">
                <label>Nom *</label>
                <input class="form-control" type="text" name="nom" required placeholder="Dupont">
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input class="form-control" type="email" name="email" required placeholder="jean.dupont@email.com">
            </div>
            <div class="form-group">
                <label>Mot de passe *</label>
                <input class="form-control" type="password" name="motDePasse" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Téléphone</label>
                <input class="form-control" type="tel" name="telephone" placeholder="+237 6xx xxx xxx">
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="button" class="yt-btn" onclick="closeModal('modal')">Annuler</button>
                <button type="submit" class="yt-btn action" style="flex: 1;">
                    <i class="fas fa-save"></i> Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Edit Client -->
<div id="modal-edit" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-pen" style="color: var(--yt-accent); margin-right: 8px;"></i>Modifier le client</h2>
            <button class="close-btn" onclick="closeModal('modal-edit')">×</button>
        </div>
        <form id="form-edit-client" onsubmit="submitEditClient(event)">
            <input type="hidden" id="edit-id" name="id">
            <div class="form-group">
                <label>Prénom *</label>
                <input class="form-control" type="text" id="edit-prenom" name="prenom" required>
            </div>
            <div class="form-group">
                <label>Nom *</label>
                <input class="form-control" type="text" id="edit-nom" name="nom" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input class="form-control" type="email" id="edit-email" name="email" required>
            </div>
            <div class="form-group">
                <label>Téléphone</label>
                <input class="form-control" type="tel" id="edit-telephone" name="telephone">
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="button" class="yt-btn" onclick="closeModal('modal-edit')">Annuler</button>
                <button type="submit" class="yt-btn action" style="flex: 1;" id="btn-submit-edit">
                    <i class="fas fa-save"></i> Mettre à jour
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function openModal(id) { document.getElementById(id || 'modal').classList.add('active'); }
function closeModal(id) { document.getElementById(id || 'modal').classList.remove('active'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
});

function openEditModal(id, nom, prenom, email, telephone) {
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-nom').value = nom;
    document.getElementById('edit-prenom').value = prenom;
    document.getElementById('edit-email').value = email;
    document.getElementById('edit-telephone').value = telephone || '';
    openModal('modal-edit');
}

function submitEditClient(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit-edit');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> En cours...';
    
    const form = e.target;
    const formData = new FormData(form);
    const data = new URLSearchParams(formData); // application/x-www-form-urlencoded
    const id = document.getElementById('edit-id').value;
    
    fetch('/api/utilisateurs/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: data
    })
    .then(res => {
        if (!res.ok) throw new Error("Erreur de modification");
        window.location.reload();
    })
    .catch(err => {
        alert("Erreur : " + err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Mettre à jour';
    });
}
</script>
</body>
</html>
