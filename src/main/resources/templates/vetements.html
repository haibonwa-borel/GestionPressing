<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(#{clothes.title})}"></head>
<body>
<th:block th:replace="~{layout :: themeScript}"></th:block>
<div class="app-container">
    <header th:replace="~{layout :: header}"></header>
    <div class="main-layout">
        <aside th:replace="~{layout :: sidebar}"></aside>
        <main class="content-area">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h1 style="font-size: 24px; margin-bottom: 8px;" th:text="#{clothes.title}">Gestion des Vêtements</h1>
                    <p style="color: var(--yt-text-secondary);" th:text="#{clothes.subtitle}">Inventaire de tous les vêtements enregistrés.</p>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div style="position: relative;">
                            <i class="fas fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--yt-text-secondary);"></i>
                            <input type="text" id="search-vetements" th:placeholder="#{clothes.search}" placeholder="Recherche texte..." onkeyup="filterVetements()" style="background: var(--yt-surface); border: 1px solid var(--yt-border); color: var(--yt-text-primary); padding: 8px 12px 8px 36px; border-radius: 18px; outline: none; width: 160px;">
                        </div>
                        <label for="search-image-input" class="yt-btn" style="padding: 8px 12px; border-radius: 50%; cursor: pointer; background: var(--yt-surface-hover);" title="Rechercher par photo">
                            <i class="fas fa-camera"></i>
                        </label>
                        <input type="file" id="search-image-input" style="display: none;" accept="image/*" onchange="searchByImage(this)">
                    </div>
                    
                    <select id="filter-cat" onchange="filterVetements()" style="background: var(--yt-surface); border: 1px solid var(--yt-border); color: var(--yt-text-primary); padding: 8px; border-radius: 18px; outline: none; margin-right: 8px;">
                        <option value="" th:text="#{clothes.allCategories}">Toutes catégories</option>
                        <option value="CHEMISE">Chemise</option>
                        <option value="PANTALON">Pantalon</option>
                        <option value="ROBE">Robe</option>
                        <option value="VESTE">Veste</option>
                        <option value="MANTEAU">Manteau</option>
                        <option value="JUPE">Jupe</option>
                        <option value="TSHIRT">T-Shirt</option>
                        <option value="COSTUME">Costume</option>
                        <option value="HAUT">Haut</option>
                        <option value="BAS">Bas</option>
                        <option value="AUTRE">Autre</option>
                    </select>
                    <button class="yt-btn action" onclick="openModal('modal-add')">
                        <i class="fas fa-plus"></i> <span th:text="#{clothes.new}">Nouveau Vêtement</span>
                    </button>
                    <!-- Toggle View -->
                    <div style="display: flex; background: var(--yt-surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--yt-border);">
                        <button onclick="setView('grid')" id="btn-grid"
                                style="padding: 8px 12px; background: var(--yt-accent); color: #fff; border: none; cursor: pointer;">
                            <i class="fas fa-th"></i>
                        </button>
                        <button onclick="setView('list')" id="btn-list"
                                style="padding: 8px 12px; background: transparent; color: var(--yt-text-primary); border: none; cursor: pointer;">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Vue Grille (YouTube style) -->
            <div id="view-grid" class="grid-container">
                <div id="no-results" style="display: none; grid-column: 1/-1; text-align: center; color: var(--yt-text-secondary); padding: 60px;">
                    <i class="fas fa-search" style="font-size: 48px; margin-bottom: 16px; display: block;"></i>
                    <span>Pas de résultat pour cette recherche</span>
                </div>

                <div id="grid-loader" class="loader-container">
                    <div class="spinner"></div>
                    <span th:text="#{clothes.searching}">Recherche en cours...</span>
                </div>

                <div th:if="${#lists.isEmpty(vetements)}"
                     style="grid-column: 1/-1; text-align: center; color: var(--yt-text-secondary); padding: 60px;">
                    <i class="fas fa-tshirt" style="font-size: 48px; margin-bottom: 16px; display: block;"></i>
                    <span th:text="#{clothes.empty}">Aucun vêtement enregistré</span>
                </div>
                <div th:each="v : ${vetements}" class="card" th:attr="data-id=${v.id}">
                    <!-- Thumbnail -->
                    <div class="card-thumbnail"
                         style="display: flex; align-items: center; justify-content: center; position: relative;">
                        <img th:if="${v.photoUrl != null and !#strings.isEmpty(v.photoUrl)}"
                             th:src="${v.photoUrl}"
                             style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;"
                             alt="photo">
                        <div th:unless="${v.photoUrl != null and !#strings.isEmpty(v.photoUrl)}"
                             style="display: flex; align-items: center; justify-content: center;
                                    width: 100%; height: 100%;
                                    background: var(--yt-surface); border-radius: 12px;">
                            <i class="fas fa-tshirt"
                               style="font-size: 48px;"
                               th:style="'font-size: 48px; color: ' + (${v.codeCouleur} ?: '#aaa')"></i>
                        </div>
                        
                        <div style="position: absolute; top: 8px; right: 8px; display: flex; gap: 4px;">
                            <button class="yt-btn" style="padding: 6px; font-size: 12px; border-radius: 50%; background: rgba(0,0,0,0.6); color: white; border: none;"
                                    th:onclick="openEditVetementModal([[${v.id}]], [[${v.description}]], [[${v.categorie}]], [[${v.couleur}]], [[${v.codeCouleur}]])">
                                <i class="fas fa-pen"></i>
                            </button>
                            <form th:action="@{/vetements/{id}(id=${v.id})}" th:method="delete" style="display:inline;" th:attr="onsubmit='return confirm(\'' + #{clothes.confirmDelete} + '\')'">
                                <button type="submit" class="yt-btn" style="padding: 6px; font-size: 12px; border-radius: 50%; background: rgba(255,0,0,0.6); color: white; border: none;">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>

                        <!-- Category badge -->
                        <span style="position: absolute; bottom: 8px; right: 8px;
                                     background: rgba(0,0,0,0.8); padding: 3px 8px;
                                     border-radius: 4px; font-size: 12px;"
                              th:text="${v.categorie}">CAT</span>
                    </div>
                    <!-- Card info -->
                    <div class="card-info">
                        <div class="card-avatar"
                             th:style="'background: ' + (${v.codeCouleur} ?: 'var(--yt-surface-hover)')">
                            <i class="fas fa-tag" style="font-size: 12px;"></i>
                        </div>
                        <div class="card-details">
                            <div class="card-title" th:text="${v.description}">Description</div>
                            <div class="card-subtitle">
                                <span th:if="${v.couleur != null}" th:text="${v.couleur}">Couleur</span>
                                <span style="margin: 0 4px; font-size: 10px;" th:if="${v.couleur != null and v.sku != null}">•</span>
                                <span style="font-family: monospace; font-size: 12px;" th:if="${v.sku != null}" th:text="${v.sku}">SKU</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vue Liste -->
            <div id="view-list" style="display: none;" class="yt-table-container">
                <table class="yt-table" id="table-vetements">
                    <thead>
                        <tr>
                            <th th:text="#{clothes.col.sku}">SKU</th>
                            <th th:text="#{clothes.col.description}">Description</th>
                            <th th:text="#{clothes.col.category}">Catégorie</th>
                            <th th:text="#{clothes.col.color}">Couleur</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="v : ${vetements}" th:attr="data-id=${v.id}">
                            <td style="font-family: monospace; font-size: 12px; color: var(--yt-accent);" th:text="${v.sku}">-</td>
                            <td th:text="${v.description}">-</td>
                            <td>
                                <span style="background: var(--yt-surface-hover); padding: 4px 8px; border-radius: 4px; font-size: 12px;"
                                      th:text="${v.categorie}">-</span>
                            </td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <div th:if="${v.codeCouleur}"
                                         th:style="'width: 16px; height: 16px; border-radius: 50%; background: ' + ${v.codeCouleur}"></div>
                                    <span th:text="${v.couleur ?: '-'}">-</span>
                                </div>
                            <td>
                                <button class="yt-btn" style="padding: 4px 8px; font-size: 12px;"
                                        th:onclick="openEditVetementModal([[${v.id}]], [[${v.description}]], [[${v.categorie}]], [[${v.couleur}]], [[${v.codeCouleur}]])">
                                    <i class="fas fa-pen"></i>
                                </button>
                            <form th:action="@{/vetements/{id}(id=${v.id})}" th:method="delete" style="display:inline;" th:attr="onsubmit='return confirm(\'' + #{clothes.confirmDelete} + '\')'">
                                <button type="submit" class="yt-btn" style="padding: 4px 8px; font-size: 12px; color: var(--yt-red);">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>
</div>

<!-- Modal Ajout Vêtement -->
<div id="modal-add" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-plus" style="color: var(--yt-accent); margin-right: 8px;"></i><span th:text="#{cloth.form.new}">Nouveau vêtement</span></h2>
            <button class="close-btn" onclick="closeModal('modal-add')">×</button>
        </div>
        <form id="form-add-vetement" th:action="@{/vetements}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label th:text="#{cloth.form.description} + ' *'">Description *</label>
                <input class="form-control" type="text" name="description" required placeholder="Ex: Chemise bleue">
            </div>
            <div class="form-group">
                <label th:text="#{cloth.form.category} + ' *'">Catégorie *</label>
                <select class="form-control" name="categorie" required>
                    <option value="CHEMISE">Chemise</option>
                    <option value="PANTALON">Pantalon</option>
                    <option value="ROBE">Robe</option>
                    <option value="VESTE">Veste</option>
                    <option value="MANTEAU">Manteau</option>
                    <option value="JUPE">Jupe</option>
                    <option value="TSHIRT">T-Shirt</option>
                    <option value="COSTUME">Costume</option>
                    <option value="HAUT">Haut</option>
                    <option value="BAS">Bas</option>
                    <option value="AUTRE">Autre</option>
                </select>
            </div>
            <div style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label th:text="#{cloth.form.color}">Couleur</label>
                    <input class="form-control" type="text" name="couleur" placeholder="Ex: Bleu ciel">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label th:text="#{cloth.form.colorCode}">Code Couleur (Hex)</label>
                    <input class="form-control" type="color" name="codeCouleur" style="height: 40px; padding: 4px;">
                </div>
            </div>
            <div class="form-group">
                <label th:text="#{cloth.form.photo}">Photo</label>
                <input class="form-control" type="file" name="photo" accept="image/*">
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="button" class="yt-btn" onclick="closeModal('modal-add')" th:text="#{cloth.form.cancel}">Annuler</button>
                <button type="submit" class="yt-btn action" style="flex: 1;" id="btn-submit-vetement">
                    <i class="fas fa-save"></i> <span th:text="#{cloth.form.save}">Enregistrer</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Edit Vêtement -->
<div id="modal-edit-vetement" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-pen" style="color: var(--yt-accent); margin-right: 8px;"></i><span th:text="#{cloth.form.edit}">Modifier le vêtement</span></h2>
            <button class="close-btn" onclick="closeModal('modal-edit-vetement')">×</button>
        </div>
        <form id="form-edit-vetement" th:action="@{/vetements}" th:method="put" enctype="multipart/form-data">
            <input type="hidden" id="edit-vet-id" name="id">
            <div class="form-group">
                <label th:text="#{cloth.form.description} + ' *'">Description *</label>
                <input class="form-control" type="text" id="edit-vet-desc" name="description" required>
            </div>
            <div class="form-group">
                <label th:text="#{cloth.form.category} + ' *'">Catégorie *</label>
                <select class="form-control" id="edit-vet-cat" name="categorie" required>
                    <option value="CHEMISE">Chemise</option>
                    <option value="PANTALON">Pantalon</option>
                    <option value="ROBE">Robe</option>
                    <option value="VESTE">Veste</option>
                    <option value="MANTEAU">Manteau</option>
                    <option value="JUPE">Jupe</option>
                    <option value="TSHIRT">T-Shirt</option>
                    <option value="COSTUME">Costume</option>
                    <option value="HAUT">Haut</option>
                    <option value="BAS">Bas</option>
                    <option value="AUTRE">Autre</option>
                </select>
            </div>
            <div style="display: flex; gap: 12px;">
                <div class="form-group" style="flex: 1;">
                    <label th:text="#{cloth.form.color}">Couleur</label>
                    <input class="form-control" type="text" id="edit-vet-couleur" name="couleur">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label th:text="#{cloth.form.colorCode}">Code Couleur (Hex)</label>
                    <input class="form-control" type="color" id="edit-vet-codeCouleur" name="codeCouleur" style="height: 40px; padding: 4px;">
                </div>
            </div>
            <div class="form-group">
                <label th:text="#{cloth.form.newPhoto}">Nouvelle Photo (laisser vide pour conserver)</label>
                <input class="form-control" type="file" name="photo" accept="image/*">
            </div>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="button" class="yt-btn" onclick="closeModal('modal-edit-vetement')" th:text="#{cloth.form.cancel}">Annuler</button>
                <button type="submit" class="yt-btn action" style="flex: 1;" id="btn-submit-edit-vetement">
                    <i class="fas fa-save"></i> <span th:text="#{cloth.form.update}">Mettre à jour</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function filterVetements() {
    const textFilter = document.getElementById('search-vetements').value.toLowerCase();
    const catFilter = document.getElementById('filter-cat').value.toLowerCase();
    let count = 0;

    // Filtrer la vue grille
    const gridItems = document.getElementById('view-grid').getElementsByClassName('card');
    for (let i = 0; i < gridItems.length; i++) {
        const text = gridItems[i].textContent || gridItems[i].innerText;
        const catBadge = gridItems[i].querySelector('.card-thumbnail span')?.textContent.toLowerCase() || "";
        
        const matchesText = text.toLowerCase().indexOf(textFilter) > -1;
        const matchesCat = catFilter === "" || catBadge === catFilter;
        
        const visible = matchesText && matchesCat;
        gridItems[i].style.display = visible ? "" : "none";
        if (visible) count++;
    }

    // Filtrer la vue liste
    const tr = document.getElementById('table-vetements').getElementsByTagName("tr");
    for (let i = 1; i < tr.length; i++) {
        if (tr[i].cells.length === 1 && tr[i].textContent.includes('Aucun')) continue;
        const text = tr[i].textContent || tr[i].innerText;
        const catCell = tr[i].cells[2].textContent.trim().toLowerCase();
        
        const matchesText = text.toLowerCase().indexOf(textFilter) > -1;
        const matchesCat = catFilter === "" || catCell === catFilter;
        
        tr[i].style.display = (matchesText && matchesCat) ? "" : "none";
    }

    document.getElementById('no-results').style.display = (count === 0 && gridItems.length > 0) ? "block" : "none";
}

function searchByImage(input) {
    if (!input.files || !input.files[0]) return;
    
    const formData = new FormData();
    formData.append('image', input.files[0]);
    
    const grid = document.getElementById('view-grid');
    const loader = document.getElementById('grid-loader');
    const noResults = document.getElementById('no-results');
    
    // UI Feedback
    grid.classList.add('searching-pulse');
    loader.style.display = 'flex';
    noResults.style.display = 'none';
    
    const csrf = getCsrfConfig();
    fetch('/api/vetements/recherche-image', {
        method: 'POST',
        headers: { [csrf.header]: csrf.token },
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        grid.classList.remove('searching-pulse');
        loader.style.display = 'none';
        
        const resultIds = data.map(v => v.id.toString());
        let count = 0;
        
        // Filtrer la Grille
        const gridItems = grid.querySelectorAll('.card');
        gridItems.forEach(card => {
            const id = card.getAttribute('data-id');
            const isMatch = resultIds.includes(id);
            card.style.display = isMatch ? "" : "none";
            if (isMatch) count++;
        });

        // Filtrer la Liste
        const tableRows = document.querySelectorAll('#table-vetements tbody tr');
        tableRows.forEach(row => {
            const id = row.getAttribute('data-id');
            row.style.display = resultIds.includes(id) ? "" : "none";
        });
        
        if (count === 0) {
            noResults.style.display = 'block';
            showToast('<i class="fas fa-search"></i> Pas de résultat trouvé.');
        } else {
            showToast('<i class="fas fa-check-circle" style="color:var(--yt-green)"></i> ' + count + ' vêtements similaires trouvés.');
        }
    })
    .catch(err => {
        grid.classList.remove('searching-pulse');
        loader.style.display = 'none';
        showToast('<i class="fas fa-exclamation-circle" style="color:var(--yt-red)"></i> Erreur : ' + err);
    });
}

function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.innerHTML = msg;
}

function setView(view) {
    const grid = document.getElementById('view-grid');
    const list = document.getElementById('view-list');
    const btnGrid = document.getElementById('btn-grid');
    const btnList = document.getElementById('btn-list');
    if (view === 'grid') {
        grid.style.display = 'grid';
        list.style.display = 'none';
        btnGrid.style.background = 'var(--yt-accent)';
        btnGrid.style.color = '#000';
        btnList.style.background = 'transparent';
        btnList.style.color = 'var(--yt-text-primary)';
    } else {
        grid.style.display = 'none';
        list.style.display = 'block';
        btnList.style.background = 'var(--yt-accent)';
        btnList.style.color = '#000';
        btnGrid.style.background = 'transparent';
        btnGrid.style.color = 'var(--yt-text-primary)';
    }
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
});

function openEditVetementModal(id, desc, cat, couleur, codeCouleur) {
    document.getElementById('form-edit-vetement').action = '/vetements/' + id;
    document.getElementById('edit-vet-id').value = id;
    document.getElementById('edit-vet-desc').value = desc;
    document.getElementById('edit-vet-cat').value = cat;
    document.getElementById('edit-vet-couleur').value = couleur || '';
    document.getElementById('edit-vet-codeCouleur').value = codeCouleur || '#ffffff';
    openModal('modal-edit-vetement');
}


</script>
<div th:replace="~{layout :: chatbot}"></div>
</body>
</html>
