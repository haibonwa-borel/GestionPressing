<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Accueil')"></head>
<body>
<th:block th:replace="layout :: themeScript"></th:block>
<div class="app-container">
    <header th:replace="layout :: header"></header>
    <div class="main-layout">
        <aside th:replace="layout :: sidebar"></aside>
        <main class="content-area">

            <h1 style="font-size: 24px; margin-bottom: 8px;">Vue d'ensemble</h1>
            <p style="color: var(--yt-text-secondary); margin-bottom: 32px;">
                Bienvenue sur votre tableau de bord Pressing App
            </p>

            <!-- Stats -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
                <a href="/clients" style="text-decoration: none;">
                    <div class="stat-card" style="background: var(--yt-surface); padding: 24px; border-radius: 12px; border: 1px solid var(--yt-border); transition: border-color 0.2s;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <p style="color: var(--yt-text-secondary); font-size: 13px; margin-bottom: 10px;">TOTAL CLIENTS</p>
                                <p style="font-size: 36px; font-weight: 700;" th:text="${totalClients}">0</p>
                            </div>
                            <div style="background: rgba(62,166,255,0.1); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-users" style="color: var(--yt-accent); font-size: 20px;"></i>
                            </div>
                        </div>
                    </div>
                </a>
                <a href="/commandes" style="text-decoration: none;">
                    <div class="stat-card" style="background: var(--yt-surface); padding: 24px; border-radius: 12px; border: 1px solid var(--yt-border); transition: border-color 0.2s;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <p style="color: var(--yt-text-secondary); font-size: 13px; margin-bottom: 10px;">COMMANDES</p>
                                <p style="font-size: 36px; font-weight: 700;" th:text="${totalCommandes}">0</p>
                            </div>
                            <div style="background: rgba(255,0,0,0.1); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-shopping-bag" style="color: var(--yt-red); font-size: 20px;"></i>
                            </div>
                        </div>
                    </div>
                </a>
                <a href="/vetements" style="text-decoration: none;">
                    <div class="stat-card" style="background: var(--yt-surface); padding: 24px; border-radius: 12px; border: 1px solid var(--yt-border); transition: border-color 0.2s;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div>
                                <p style="color: var(--yt-text-secondary); font-size: 13px; margin-bottom: 10px;">VÊTEMENTS</p>
                                <p style="font-size: 36px; font-weight: 700;" th:text="${totalVetements}">0</p>
                            </div>
                            <div style="background: rgba(43,166,64,0.1); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-tshirt" style="color: var(--yt-green); font-size: 20px;"></i>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Actions rapides -->
            <h2 style="font-size: 18px; font-weight: 500; margin-top: 40px; margin-bottom: 16px;">Actions rapides</h2>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <a href="/commandes" class="yt-btn action">
                    <i class="fas fa-plus"></i> Nouvelle commande
                </a>
                <a href="/utilisateurs" class="yt-btn">
                    <i class="fas fa-user-plus"></i> Ajouter un client
                </a>
                <a href="/vetements" class="yt-btn">
                    <i class="fas fa-plus"></i> Ajouter un vêtement
                </a>
                <button class="yt-btn" onclick="declencherRappels()" id="btn-rappels">
                    <i class="fas fa-bell"></i> Envoyer rappels 24h
                </button>
            </div>

            <!-- Toast notification -->
            <div id="toast" style="display:none; position:fixed; bottom:24px; right:24px;
                 background:var(--yt-surface); border:1px solid var(--yt-border); border-radius:8px;
                 padding:16px 24px; font-size:14px; z-index:9999; box-shadow: 0 4px 24px rgba(0,0,0,0.4);">
            </div>

        </main>
    </div>
</div>

<style>
    .stat-card:hover { border-color: var(--yt-accent) !important; }
</style>

<script>
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 4000);
}

function declencherRappels() {
    const btn = document.getElementById('btn-rappels');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...';
    fetch('/api/notifications/rappels/declencher', { method: 'POST' })
        .then(res => res.text())
        .then(data => { showToast('✅ ' + data); })
        .catch(err => { showToast('❌ Erreur : ' + err); })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-bell"></i> Envoyer rappels 24h';
        });
}
</script>
<div th:replace="layout :: chatbot"></div>
</body>
</html>
