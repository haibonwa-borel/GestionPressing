spring.application.name=pressing-app
server.port=8080

# ==============================
# BASE DE DONNEES SQLite
# ==============================
spring.thymeleaf.cache=false
spring.datasource.url=jdbc:sqlite:./pressing.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Cree/met a jour les tables automatiquement au demarrage
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Charger data.sql apres la creation des tables par Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Desactiver open-session-in-view (bonne pratique)
spring.jpa.open-in-view=false

# ==============================
# CONFIGURATION EMAIL (zevaba.com)
# ==============================
spring.mail.host=zevaba.com
spring.mail.port=587
spring.mail.username=Contact@zevaba.com
spring.mail.password=Eeuezpass0000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================
# SWAGGER UI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
