spring.application.name=pressing-app
server.port=8080
spring.profiles.include=secrets

# ==============================
# BASE DE DONNEES SQLite
# ==============================
spring.thymeleaf.cache=false
spring.datasource.url=jdbc:sqlite:./pressing.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Cree/met a jour les tables automatiquement au demarrage
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Charger data.sql apres la creation des tables par Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Desactiver open-session-in-view (bonne pratique)
spring.jpa.open-in-view=false

# SQLite ne supporte pas bien la concurrence : limiter a 1 connexion dans le pool
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=10000

# ==============================
# CONFIGURATION EMAIL (zevaba.com)
# ==============================
spring.mail.host=zevaba.com
spring.mail.port=587
spring.mail.username=Contact@zevaba.com
spring.mail.password=Eeuezpass0000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================
# SWAGGER UI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

